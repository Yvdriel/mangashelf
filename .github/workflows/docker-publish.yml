name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # The Android client lives under android/** and has its own workflow; docs are inert.
    # Skip the Docker/Next.js build when a push touches only those (CH.4 6.3 path filter).
    paths-ignore:
      - "android/**"
      - "docs/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/mangashelf" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "value=${{ github.event.head_commit.timestamp || format('{0}Z', github.event.repository.updated_at) }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
