[versions]
# Toolchain — pinned to the MMD-1.0.0-proven matrix (see KompaktCalendar reference app).
agp = "8.3.0"
kotlin = "1.9.22"
composeCompiler = "1.5.10"
# AndroidX / Compose
coreKtx = "1.13.1"
splashscreen = "1.0.1"
lifecycle = "2.8.3"
activityCompose = "1.10.1"
composeUi = "1.7.3"
material3 = "1.3.1"
androidMaterial = "1.13.0"
navigationCompose = "2.7.7"
datastore = "1.1.1"
# Mudita
mmd = "1.0.0"
# Async / serialization
coroutines = "1.8.1"
serializationJson = "1.6.3"
# DI
hilt = "2.51.1"
hiltExt = "1.2.0"
# Persistence
room = "2.6.1"
# Dictionary data layer (CH.6 D1.3) — androidx.sqlite BundledSQLiteDriver: ships a modern
# SQLite (3.49+, FTS5 compiled, arm64) usable STANDALONE without Room. API-28 framework SQLite
# lacks FTS5, and Room 2.6.1 can't model the gloss_fts virtual table or load the hand-baked DB
# (no room_master_table) → raw DAO over the bundled driver instead.
androidxSqlite = "2.5.2"
# Network
retrofit = "2.11.0"
okhttp = "4.12.0"
# Background work
work = "2.9.1"
# Image loading — Coil 2.x (last 2.x line; Coil 3 needs Kotlin 2). CH.4 covers.
coil = "2.7.0"
# Secure storage — EncryptedSharedPreferences (bearer token + server URL). CH.4.
securityCrypto = "1.1.0-alpha06"
# Dictionary — romaji↔kana (pure-Kotlin WanaKana v4 port, MIT). CH.2 D1.2.
wanakana = "1.1.1"
# Flashcards — Anki Rust backend (rsdroid), bundles arm64-v8a librsdroid.so + pre-gen proto.
ankiBackend = "0.1.50-anki25.02"
# Test
junit = "4.13.2"
androidxJunit = "1.1.5"
espresso = "3.5.1"
androidxTestRunner = "1.5.2"
androidxTestCore = "1.5.0"

