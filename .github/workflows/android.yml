name: Android CI

# Path-filtered to android/** so it runs only for the Android client (CH.4 6.3); the Docker/Next.js
# workflow is filtered the other way (paths-ignore android/**), so an android-only change never
# triggers a web build and vice-versa.
on:
  push:
    branches: [main, mudita-port]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # JVM unit tests only — instrumented Room/worker/Compose tests need an emulator and run locally.
      - name: Assemble + unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
